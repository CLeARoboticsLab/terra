defaults:
  - system: ernest_no-vel_no-devs
  - model: world_model
  - loss: world_model
  - _self_

run_name:

data:
  dataset_dir:
  num_train_workers: 8
  num_test_workers: 4
  prefetch_factor: 2

data_mods:
  add_noise: true

training:
  num_epochs: 100
  max_steps: 600000
  eval_interval: 10000  # evaluates and checkpoints at this interval
  learning_rate: 0.0002
  warmup_steps: 1000
  decay_steps: 400000
  end_learning_rate: 0.0001
  batch_size: 64
  training_data_ratio: 0.995
  seed: 42

checkpoint:
  enabled: true
  # create a checkpoint in this directory with the given run name, if resume_checkpoint is not set
  checkpoint_dir:
  # keeps this many most recent checkpoints; leave blank to keep all
  max_to_keep:
  # if non-empty, resume from this checkpoint
  resume_checkpoint:

wandb:
  log: False
  project: terra_model_train
  entity:
