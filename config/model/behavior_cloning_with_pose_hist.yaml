type: behavior_cloning_with_pose_hist

dataset:
  type: behavior_cloning_with_pose_hist
  history_length: 10
  prediction_length: 10
  expert_data_only: true

dropout:
  mlp: 0.2
  attention: 0.05

embed_dim: 64

embedding:
  mlp_hidden_size_factor: 2
  obs_layers: 2
  acts_layers: 0
  poses_hist_layers: 0

# heads
actions:
  attention:
    layers: 4
    heads: 8
    mlp_hidden_size_factor: 4
    mask:  # causal or leave empty
  decoder:
    layers: 2
    mlp_hidden_size_factor: 2