[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terra"
version = "0.1.0"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
    "flax==0.10.6",
    "hydra-core==1.3.2",
    "orbax-checkpoint==0.11.15",
]

[project.optional-dependencies]
training = [
    "h5py==3.14.0",
    "matplotlib>=3.10",
    "optax==0.2.5",
    "pytest",
    "torch==2.7.1",
    "tqdm>=4.67.1",
    "wandb>=0.20.0",
]

[tool.setuptools.packages.find]
include = ["terra"]